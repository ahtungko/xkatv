<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>网络连接已断开 · xkaTV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#09090b" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #09090b;
        --card: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #fafafa;
        --accent-text: #09090b;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --card: #ffffff;
          --border: #e4e4e7;
          --text: #09090b;
          --muted: #71717a;
          --accent: #09090b;
          --accent-text: #fafafa;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      .card {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        border-radius: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
      }

      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: block;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 24px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-text);
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/favicon.svg" alt="xkaTV" />
      <h1>当前处于离线状态</h1>
      <p>无法连接到网络或服务器，请检查网络连接后重试。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload()
      })
    </script>
  </body>
</html>
