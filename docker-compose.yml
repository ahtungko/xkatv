services:
  xkatv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    ports:
      - '3000:80'
    environment:
      NODE_ENV: production
      XKA_INITIAL_VIDEO_SOURCES: ${XKA_INITIAL_VIDEO_SOURCES:-${XKA_INITIAL_VIDEO_SOURCES:-}}
      XKA_TMDB_API_TOKEN: ${XKA_TMDB_API_TOKEN:-${XKA_TMDB_API_TOKEN:-}}
      XKA_TMDB_API_BASE_URL: ${XKA_TMDB_API_BASE_URL:-${XKA_TMDB_API_BASE_URL:-}}
      XKA_TMDB_IMAGE_BASE_URL: ${XKA_TMDB_IMAGE_BASE_URL:-${XKA_TMDB_IMAGE_BASE_URL:-}}
      XKA_SUPABASE_URL: ${XKA_SUPABASE_URL:-${XKA_SUPABASE_URL:-}}
      XKA_DISABLE_ANALYTICS: ${XKA_DISABLE_ANALYTICS:-${XKA_DISABLE_ANALYTICS:-true}}
      XKA_INITIAL_CONFIG: ${XKA_INITIAL_CONFIG:-}
    restart: unless-stopped
    container_name: xkatv-dev

    # 日志轮转
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

    # 健康检查
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
